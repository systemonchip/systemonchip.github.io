<script>
  (function () {
    var nav = document.querySelector(".masthead .greedy-nav");
    var themeCss = document.getElementById("theme-css");
    if (!nav || !themeCss) return;

    var button = document.createElement("button");
    button.type = "button";
    button.className = "theme-toggle";

    function darkOn() {
      return document.documentElement.getAttribute("data-theme") === "dark";
    }

    var sun = '<svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    var moon = '<svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

    function paint() {
      var dark = darkOn();
      button.innerHTML = dark ? sun : moon;
      button.setAttribute("aria-pressed", dark ? "true" : "false");
      button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    }

    button.addEventListener("click", function () {
      var next = darkOn() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      themeCss.href = next === "dark" ? themeCss.getAttribute("data-dark") : themeCss.getAttribute("data-light");
      paint();
    });

    paint();
    var search = nav.querySelector(".search__toggle");
    if (search) nav.insertBefore(button, search);
    else nav.appendChild(button);
  })();
</script>
